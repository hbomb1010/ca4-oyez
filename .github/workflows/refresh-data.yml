name: Refresh CA4 case data

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Only include oral arguments on/after this date (YYYY-MM-DD)"
        required: true
        default: "2026-09-02"
      download:
        description: "Also download audio/PDF files (slower; needed for opinion parsing)"
        type: boolean
        default: true
  schedule:
    # Every Monday 13:00 UTC (~9am Eastern). Looks back 14 days, not just
    # 7, so a single missed/failed run doesn't create a gap -- re-including
    # already-seen cases is harmless, build_dataset.py just rebuilds
    # cases.json fresh each time rather than appending.
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      - name: Determine since date
        id: since
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "value=$(date -u -d '-14 days' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.since }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build dataset
        working-directory: scraper
        run: |
          ARGS="--since ${{ steps.since.outputs.value }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.download }}" != "true" ]; then
            ARGS="$ARGS --no-download"
          fi
          python build_dataset.py $ARGS

      - name: Build feed
        working-directory: scraper
        run: python build_feed.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cases.json data/feed.xml
          git diff --cached --quiet || git commit -m "Refresh case data (since ${{ steps.since.outputs.value }})"
          git push

      - name: Prepare public site
        run: |
          mkdir -p public
          cp data/feed.xml public/
          cp assets/artwork/cover-1400.jpg public/
          cp site-stub/index.html public/

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
